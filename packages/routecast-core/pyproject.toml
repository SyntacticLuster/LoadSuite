[tool.poetry]
name = "routecast-core"
version = "0.1.0"
description = "RouteCast core models and utilities"
authors = ["LoadSuite Team <dev@example.com>"]
package-mode = true
packages = [{ include = "routecast_core" }]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
