[tool.poetry]
name = "routecast-routing"
version = "0.1.0"
description = "RouteCast routing provider interfaces and stubs"
authors = ["LoadSuite Team <dev@example.com>"]
package-mode = true
packages = [{ include = "routecast_routing" }]

[tool.poetry.dependencies]
python = "^3.10"
routecast-core = { path = "../routecast-core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
