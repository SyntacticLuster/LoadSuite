[tool.poetry]
name = "loadsuite"
version = "0.1.1"
description = "FreightLens MVP (UI-first) bundle"
authors = ["SyntacticLuster <noreply@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.125.0"
uvicorn = "^0.38.0"
asyncpg = "^0.30.0"
pydantic-settings = "^2.7.0"
python-dotenv = "^1.0.1"
a2wsgi = "^1.10.10"

[tool.poetry.dev-dependencies]
# pytest can be used for future verification scripts when needed.
pytest = "^8.3"

[[tool.poetry.packages]]
include = "app"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"