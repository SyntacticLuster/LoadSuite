<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoadBoard v0.1.0</title>
    <script>
      tailwind = { config: { darkMode: "class" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("lb_theme");
          const isDark = theme === "dark" || theme === null;
          document.documentElement.classList.toggle("dark", isDark);
        } catch {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div class="max-w-3xl lg:max-w-6xl mx-auto px-4 py-4">
      <header class="flex items-center justify-between gap-3 pb-3">
        <div>
          <div class="text-lg font-semibold leading-tight">RoadBoard v0.1.0</div>
          <div id="meta" class="text-xs text-slate-600 dark:text-slate-400"></div>
        </div>
        <a href="/#/settings" class="text-sm font-medium underline">Settings</a>
      </header>

      <main id="app"></main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
